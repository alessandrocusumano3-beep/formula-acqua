<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-label="Formula Acqua" overflow="visible">
  <style>
    text, tspan { text-decoration: none !important; }
  </style>
  <defs>
    <!-- Goccia: gradiente premium azzurro → blu cobalto -->
    <linearGradient id="faDrop" x1="32%" y1="0%" x2="68%" y2="100%">
      <stop offset="0%" stop-color="#F4FBFF"/>
      <stop offset="14%" stop-color="#9DDCFF"/>
      <stop offset="38%" stop-color="#4DBAF0"/>
      <stop offset="68%" stop-color="#0B8FD4"/>
      <stop offset="100%" stop-color="#064A7A"/>
    </linearGradient>
    <radialGradient id="faDropGlow" cx="38%" cy="32%" r="52%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="35%" stop-color="#7DD3FC" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faDropSheen" x1="15%" y1="5%" x2="55%" y2="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.48"/>
      <stop offset="38%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="faDropRim" cx="72%" cy="68%" r="45%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0"/>
    </radialGradient>

    <!-- Onda: celeste → blu, leggera trasparenza -->
    <linearGradient id="faWave" x1="0%" y1="35%" x2="100%" y2="65%">
      <stop offset="0%" stop-color="#C7EBFF" stop-opacity="0.75"/>
      <stop offset="22%" stop-color="#7DD3FC" stop-opacity="0.9"/>
      <stop offset="48%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="74%" stop-color="#0284C7" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#075985" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="faWaveGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#021526" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="faWaveShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="faDropDepth" x="-40%" y="-28%" width="180%" height="175%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#010914" flood-opacity="0.4"/>
    </filter>
    <filter id="faLetterBehind" x="-14%" y="-12%" width="128%" height="128%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#010914" flood-opacity="0.12"/>
    </filter>
    <filter id="faWaveSoft" x="-8%" y="-55%" width="116%" height="210%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.5" flood-color="#010914" flood-opacity="0.2"/>
    </filter>

    <clipPath id="faWaveClip">
      <path d="
        M 118 158
        C 155 178 188 138 228 150
        C 262 160 292 182 330 164
        C 358 152 385 150 418 151.5
        L 525 151.5
        L 556 155
        L 525 158.5
        L 418 158.5
        C 385 160 358 168 330 176
        C 292 188 262 168 228 164
        C 188 158 155 188 118 158
        Z
      "/>
    </clipPath>
  </defs>

  <!-- 1. F — dietro la goccia, più vicina -->
  <g id="fa-logo-f" class="fa-logo-f" filter="url(#faLetterBehind)" fill="#FFFFFF">
    <path d="
      M198 72
      H272
      V94
      H222
      V124
      H262
      V145
      H222
      V202
      H198
      Z"/>
  </g>

  <!-- 2. A — dietro; senza barra (è l'onda). Spostata di ulteriori 8 unità verso destra: gap identico a quello F↔goccia (4 unità ciascuno, misurati via bounding box), goccia perfettamente centrata nel viewBox. -->
  <g id="fa-logo-a" class="fa-logo-a" filter="url(#faLetterBehind)" fill="#FFFFFF">
    <path d="
      M408 202
      L454 70
      L478 70
      L440 202
      Z"/>
    <path d="
      M470 70
      L494 70
      L540 202
      L512 202
      Z"/>
  </g>

  <!-- 3. Goccia — protagonista, davanti a F/A -->
  <g id="fa-logo-drop" class="fa-logo-drop" filter="url(#faDropDepth)">
    <path
      class="fa-logo-drop__body"
      d="M340 14
         C310 72 276 120 276 162
         C276 194 304 218 340 218
         C376 218 404 194 404 162
         C404 120 370 72 340 14 Z"
      fill="url(#faDrop)"
    />
    <path
      class="fa-logo-drop__glow"
      d="M340 14
         C310 72 276 120 276 162
         C276 194 304 218 340 218
         C376 218 404 194 404 162
         C404 120 370 72 340 14 Z"
      fill="url(#faDropGlow)"
    />
    <path
      class="fa-logo-drop__rim"
      d="M340 14
         C310 72 276 120 276 162
         C276 194 304 218 340 218
         C376 218 404 194 404 162
         C404 120 370 72 340 14 Z"
      fill="url(#faDropRim)"
    />
    <path
      class="fa-logo-drop__sheen"
      d="M340 14
         C310 72 276 120 276 162
         C276 194 304 218 340 218
         C376 218 404 194 404 162
         C404 120 370 72 340 14 Z"
      fill="url(#faDropSheen)"
    />
    <ellipse
      class="fa-logo-drop__glint"
      cx="314" cy="108" rx="13" ry="22"
      fill="#FFFFFF" opacity="0.26"
      transform="rotate(-20 314 108)"
    />
  </g>

  <!--
    4. Onda — stile riferimento:
    entra da sinistra → passa davanti alla goccia →
    trattino della A → esce assottigliandosi
  -->
  <g id="fa-logo-wave" class="fa-logo-wave" filter="url(#faWaveSoft)">
    <path
      class="fa-logo-wave__body"
      fill="url(#faWave)"
      d="
        M 118 158
        C 155 178 188 138 228 150
        C 262 160 292 182 330 164
        C 358 152 385 150 418 151.5
        C 450 148 495 148 525 151.5
        L 556 155
        L 525 158.5
        C 495 155 450 155 418 158.5
        C 385 160 358 168 330 176
        C 292 188 262 168 228 164
        C 188 158 155 188 118 158
        Z
      "
    />
    <path
      class="fa-logo-wave__glass"
      fill="url(#faWaveGlass)"
      opacity="0.75"
      d="
        M 118 158
        C 155 178 188 138 228 150
        C 262 160 292 182 330 164
        C 358 152 385 150 418 151.5
        C 450 148 495 148 525 151.5
        L 556 155
        L 525 156.6
        C 495 153 450 153 418 156.4
        C 385 156.8 358 160 330 166
        C 292 174 262 162 228 156
        C 188 148 155 172 118 158
        Z
      "
    />
    <g clip-path="url(#faWaveClip)">
      <rect
        class="fa-logo-wave__shine"
        x="90"
        y="128"
        width="78"
        height="52"
        fill="url(#faWaveShine)"
        opacity="0"
      />
    </g>
  </g>

  <!-- Wordmark -->
  <text
    class="fa-logo-wordmark"
    x="340" y="268"
    dx="-3.5"
    text-anchor="middle"
    font-family="Montserrat, Plus Jakarta Sans, Avenir Next, Gotham, Helvetica Neue, Arial, sans-serif"
    font-size="32"
    font-weight="700"
    letter-spacing="7"
  >
    <tspan fill="#FFFFFF">Formul</tspan><tspan fill="#5EC8F8">Acqua</tspan>
  </text>

  <!-- Tagline + linee laterali eleganti -->
  <g class="fa-logo-tagline" opacity="0.92">
    <line x1="132" y1="299" x2="188" y2="299" stroke="#E8F4FF" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <text
      x="340" y="303"
      dx="-2"
      text-anchor="middle"
      font-family="Montserrat, Plus Jakarta Sans, Avenir Next, Gotham, Helvetica Neue, Arial, sans-serif"
      font-size="11"
      font-weight="500"
      letter-spacing="4"
      fill="#E8F4FF"
    >TUTTO PER LA TUA PISCINA</text>
    <line x1="492" y1="299" x2="548" y2="299" stroke="#E8F4FF" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
